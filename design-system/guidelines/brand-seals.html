<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script><style>body{margin:0;font-family:var(--font-body);display:flex;height:200px}.ring{width:52px;height:52px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold)}.lbl{font-size:9px;letter-spacing:.2em;margin-top:8px;color:var(--text-on-dark-muted);text-align:center}</style></head><body>
<div style="flex:.8;background:var(--ivory);display:flex;align-items:center;justify-content:center">
<div style="width:120px;height:120px;border-radius:50%;border:1px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
<span style="font-family:var(--font-display);font-size:34px;color:var(--forest)">F</span>
<span style="font-size:7px;letter-spacing:.28em;color:var(--olive)">NATURE · SCIENCE</span>
</div>
</div>
<div style="flex:1.4;background:var(--gradient-dark);display:flex;align-items:center;justify-content:center;gap:28px">
<div><div class="ring"><i data-lucide="leaf" style="width:22px"></i></div><div class="lbl">NATURAL</div></div>
<div><div class="ring"><i data-lucide="flask-conical" style="width:22px"></i></div><div class="lbl">SCIENCE</div></div>
<div><div class="ring"><i data-lucide="shield-plus" style="width:22px"></i></div><div class="lbl">IMMUNITY</div></div>
<div><div class="ring"><i data-lucide="zap" style="width:22px"></i></div><div class="lbl">ENERGY</div></div>
<div><div class="ring"><i data-lucide="heart" style="width:22px"></i></div><div class="lbl">WELLNESS</div></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
