<!-- @dsCard group="Brand" viewport="700x220" subtitle="Glass data card + lab readout aesthetics on the dark ground" name="Lab data on dark" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body)}</style></head><body>
<div style="background:var(--gradient-dark);height:220px;display:flex;align-items:center;gap:24px;padding:0 28px;box-sizing:border-box">
<div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:6px;backdrop-filter:blur(14px);padding:20px 24px;color:var(--ivory);flex:1">
<div style="font-size:10px;letter-spacing:.25em;color:var(--leaf-light)">BATCH FM-2026-001</div>
<div style="font-family:var(--font-display);font-size:38px;margin-top:6px">1.2<span style="font-size:20px">%</span></div>
<div style="font-size:11px;color:var(--text-on-dark-muted)">Cordycepin content · lab-verified</div>
</div>
<div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:6px;backdrop-filter:blur(14px);padding:20px 24px;color:var(--ivory);flex:1.3;font-variant-numeric:tabular-nums">
<div style="font-size:10px;letter-spacing:.25em;color:var(--leaf-light)">GROW ROOM · LIVE</div>
<div style="display:flex;gap:24px;margin-top:10px;font-size:12px;letter-spacing:.06em">
<div>TEMP<br><span style="font-size:18px;font-weight:500">21.0°C</span></div>
<div>RH<br><span style="font-size:18px;font-weight:500">85%</span></div>
<div>CO₂<br><span style="font-size:18px;font-weight:500">720ppm</span></div>
<div>DAY<br><span style="font-size:18px;font-weight:500">42/90</span></div>
</div>
</div>
</div>
</body></html>
