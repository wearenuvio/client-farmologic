<!-- @dsCard group="Colors" viewport="700x190" subtitle="Gold is never a block — hairlines, frames, seals, single words" name="Gold usage" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);background:var(--ivory);display:flex;gap:24px;padding:20px;height:190px;box-sizing:border-box;align-items:stretch}</style></head><body>
<div style="flex:1">
<div style="font-family:var(--font-display);font-size:24px;color:var(--forest)">Why Quality Starts <em style="font-style:normal;color:var(--gold)">Before Harvest</em></div>
<div style="width:64px;border-top:1px solid var(--gold);margin:12px 0"></div>
<div style="font-size:11px;color:var(--text-muted)">Hairline rule under headlines · gold word highlight</div>
</div>
<div style="flex:1;background:var(--forest);box-shadow:var(--frame-gold-inset);position:relative;display:flex;align-items:center;justify-content:center">
<div style="position:absolute;inset:10px;border:1px solid var(--border-gold)"></div>
<div style="color:var(--ivory);font-family:var(--font-display);font-size:18px">1px gold inner frame</div>
</div>
<div style="flex:.6;display:flex;align-items:center;justify-content:center;background:var(--mist)">
<div style="width:84px;height:84px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.22em;color:var(--forest);text-align:center">LAB<br>VERIFIED</div>
</div>
</body></html>
